name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true

      - name: Find the app file
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then cp index.html www/index.html; fi
          test -f www/index.html && echo "Found the app file"
          ls -l www

      - name: Install packages
        run: npm install

      - name: Connect the alert plugin to the app
        run: |
          cat > bridge.js <<'JS'
          import { LocalNotifications } from '@capacitor/local-notifications';
          window.DGLocalNotifications = LocalNotifications;
          JS
          npx --yes esbuild@0.21.5 bridge.js --bundle --minify --format=iife --outfile=www/bridge.js
          sed -i '0,/<script>/s#<script>#<script src="bridge.js"></script>\n<script>#' www/index.html
          grep -n 'bridge.js' www/index.html
          ls -l www

      - name: Create the Android project
        run: npx cap add android

      - name: Make the calm alert sounds
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import math, struct, wave
          SR = 22050
          SOUNDS = {'task_done': ('focus', [(659.25, 0, 3.2), (987.77, 1, 3.8)]),
                    'break_done': ('brk', [(293.66, 0, 5.2), (440, 0.4, 5.2)])}
          DECAY = {'focus': 0.9, 'brk': 1.7}
          PARTIALS = [(1, 1), (1.004, 0.55), (2, 0.28), (3, 0.1)]
          for name, (kind, notes) in SOUNDS.items():
              tail = max(t + d for f, t, d in notes) + 0.2
              n = int(math.ceil(tail * SR))
              acc = [0.0] * n
              for f, t, d in notes:
                  st = round(t * SR)
                  ln = round(d * SR)
                  fade = round(0.08 * SR)
                  for i in range(ln):
                      if st + i >= n:
                          break
                      tt = i / SR
                      env = (1 - math.exp(-tt / 0.05)) * math.exp(-tt / DECAY[kind]) * min(1, (ln - i) / fade)
                      acc[st + i] += env * sum(a * math.sin(2 * math.pi * f * r * tt) for r, a in PARTIALS if f * r < SR / 2 - 300)
              g = 0.8 / max(abs(x) for x in acc)
              w = wave.open('android/app/src/main/res/raw/' + name + '.wav', 'wb')
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(SR)
              w.writeframes(b''.join(struct.pack('<h', round(x * g * 32767)) for x in acc))
              w.close()
              print('made', name)
          PY
          ls -l android/app/src/main/res/raw

      - name: Add permissions
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build the app file
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Keep a copy of the app file
        uses: actions/upload-artifact@v4
        with:
          name: dump-and-go-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish a download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Dump and Go app ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
