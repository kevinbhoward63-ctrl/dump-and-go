name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install packages
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Add the calm alert sounds and permissions
        run: |
          mkdir -p android/app/src/main/res/raw
          cp sounds/*.wav android/app/src/main/res/raw/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build the app file
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Keep a copy of the app file
        uses: actions/upload-artifact@v4
        with:
          name: dump-and-go-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish a download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Dump and Go app ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
